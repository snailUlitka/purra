[package]
name = "purra"
version = "0.2.0"
edition = "2024"
description = "High-performance Unicode character replacement engine and CLI"

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
clap = { version = "4.6.6", features = ["derive"] }
tempfile = "3.27.0"
thiserror = "2.0.20"
walkdir = "2.5.0"

[dev-dependencies]
assert_cmd = "2.2.2"
criterion = "0.8.2"
predicates = "3.1.4"

[[bench]]
name = "engine"
harness = false
